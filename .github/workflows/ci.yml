name: CI

on:
  push:
    branches: [main, develop]
    paths: ['back/**', '.github/workflows/ci.yml']
  pull_request:
    branches: [main, develop]
    paths: ['back/**', '.github/workflows/ci.yml']

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: tably
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      # 2막 Redis 경로 통합 테스트용 (Redis*Test — 로컬에 Redis 없으면 스킵되는 테스트들을 CI에서는 실행)
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: Y2ktb25seS1kdW1teS1qd3Qtc2VjcmV0LWtleS0zMmJ5dGVzISE=
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: 빌드 및 전체 테스트 (동시성 통합 테스트 포함)
        run: ./gradlew build

      - name: 실패 시 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: back/build/reports/tests/test
