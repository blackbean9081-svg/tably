spring.application.name=tably

# 시크릿은 git 추적 제외된 application-local.properties에서 로드 (운영 배포 시 환경변수로 교체)
spring.config.import=optional:classpath:application-local.properties

# DB 연결
spring.datasource.url=jdbc:postgresql://localhost:5432/tably
spring.datasource.username=postgres
# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

jwt.access-token-validity-ms=3600000

# 2막: Redis 전환 토글 (k6 전후 비교를 위해 코드가 아니라 설정으로 전환)
# tably.slot-hold.mode — db(1막: DB 행 락만) | redis(슬롯 선점 앞에 Redis SET NX 게이트)
tably.slot-hold.mode=db
spring.data.redis.host=localhost
spring.data.redis.port=6379
